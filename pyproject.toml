[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunesmith"
version = "0.1.0"
description = "TuneSmith — Desktop fine-tuning workbench: guided data prep, local fine-tuning (0.5B-10B on consumer hardware), model lifecycle management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Benson Luo"}
]
keywords = ["llm", "qlora", "fine-tuning", "lora", "transformers", "nlp", "domain-adaptation", "mlflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch 2.4.0 = first release with the complete DCP call surface we use
    # (async_save + no_dist kwarg); verified against 2.11.
    "torch>=2.4.0",
    # TRL 1.4 itself floors transformers>=4.56.2; >=5.0 is the line we test
    # against (warmup_steps float-ratio semantics, eval_strategy validation).
    "transformers>=5.0",
    # peft 0.19.0 first ships peft.tuners.lora.loraga (preprocess_loraga) and
    # LoraGAConfig — both imported at module load by src/training/sft_trainer.py.
    "peft>=0.19.0",
    "bitsandbytes>=0.41.0",
    "trl>=1.4.0",  # DPOConfig.loss_type list, processing_class, GRPO w/o ref_model kwarg
    "accelerate>=0.25.0",
    "datasets>=2.15.0",
    "scipy>=1.10.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "wandb>=0.16.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
]

notebook = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
]

ui = [
    "mlflow>=2.10.0",
    "streamlit>=1.36.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
]

# vLLM fast generation for GRPO — CUDA-only, heavy; opt-in by design so the
# 8 GB consumer-GPU base install stays light (see config/grpo.py use_vllm).
vllm = [
    "vllm>=0.11.0",
]

# Liger fused Triton kernels (~20% throughput, ~60% activation-memory cut).
# Opt-in via TrainingConfig.use_liger_kernel=True (see config/base.py).
liger = [
    "liger-kernel>=0.5.0",
]

# EleutherAI lm-evaluation-harness — industry-standard public benchmarks.
# 0.4.10 (2026-01) split model backends into extras: [hf] reuses the pinned
# torch/transformers/accelerate instead of adding version constraints.
eval = [
    "lm_eval[hf]>=0.4.10",
]

all = [
    "qlora-post-training[dev,notebook,ui,eval]",
]

[project.scripts]
train-sft = "scripts.train_sft:app"
train-domain = "scripts.train_medical_entity:app"
train-dpo = "scripts.train_dpo:main"
train-grpo = "scripts.train_grpo:app"
merge-lora = "scripts.merge_lora:app"
evaluate-model = "scripts.evaluate:app"
run-flywheel = "scripts.run_flywheel_iteration:app"
download-data = "scripts.download_data:app"
eval-harness = "scripts.eval_harness:app"
qlora-dashboard = "scripts.launch_dashboard:app"

[project.urls]
Homepage = "https://github.com/Bensonluo/4bit-QLoRA-post-training"
Repository = "https://github.com/Bensonluo/4bit-QLoRA-post-training"
Issues = "https://github.com/Bensonluo/4bit-QLoRA-post-training/issues"

# The codebase imports as top-level `src.*`, `config.*`, `scripts.*` (e.g.
# `from src.models import ...`), so all three roots must be packaged —
# `where = ["src"]` alone installed inner package names only and broke every
# console script when run outside the repo.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify (incl. SIM105 suppressible-exception, SIM117 nested-with)
    "S110", # flake8-bandit: try-except-pass — silent failures must log or suppress explicitly
    "S112", # flake8-bandit: try-except-continue
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B905",  # zip() without strict= (common in data/ML code; lengths are paired by construction)
    "C408",  # dict() calls used heavily for Plotly kwargs (idiomatic there)
    "C401",  # unnecessary generators in set() calls (style-only, low value for this codebase)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "peft.*",
    "trl.*",
    "bitsandbytes.*",
    "accelerate.*",
    "wandb.*",
    "mlflow.*",
    "plotly.*",
    "datasets.*",
    "lm_eval.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
